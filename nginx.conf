server {
    listen 4002;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Behind a proxy (Cloudflare): never emit redirects containing the internal host/port
    absolute_redirect off;
    port_in_redirect off;

    # Enable Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json application/ld+json application/manifest+json image/svg+xml;

    # Pre-rendered landing page — always revalidate so crawlers and visitors get fresh HTML
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA routing — serve pre-rendered pages (/privacy → /privacy/index.html) directly,
    # without the trailing-slash 301 that nginx issues for directories
    location / {
        try_files $uri $uri/index.html /index.html;
    }

    # SEO files — short cache
    location ~* ^/(robots\.txt|sitemap\.xml|site\.webmanifest)$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # Hashed build assets — cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Images & fonts in public/ (not hashed) — cache for a week
    location ~* \.(png|jpg|jpeg|gif|webp|avif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
